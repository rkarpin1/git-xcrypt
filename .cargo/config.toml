# Hardware AES on aarch64, which the cipher crate will not take on its own.
#
# `aes` 0.8 auto-detects AES-NI on x86 and x86_64, so those targets already run
# the hardware backend. On aarch64 the ARMv8 Cryptography Extensions sit behind
# this opt-in flag, and without it every encryption and decryption runs the
# constant-time bitsliced software backend instead.
#
# Measured on this machine (aarch64-apple-darwin, `--release`, median of three):
#
#   8 MB blob through `git-xcrypt diff`      148 ms  ->    9 ms
#   `git checkout` of 200 x 87 KB secrets    410 ms  ->   50 ms
#   `git add -A` over the same 200 files     480 ms  ->  110 ms
#
# Two things make it safe to take. Detection is at **runtime** on macOS and
# Linux — `cpufeatures` asks `sysctlbyname` or `getauxval`, and every other
# platform answers `false` — so a CPU without the extensions falls back to the
# same software backend rather than trapping on an illegal instruction. And AES
# is AES: the two backends compute the same function, so not one byte of
# ciphertext moves. The frozen format vectors in `tests/format_vectors.rs` are
# what proves that rather than the argument.
#
# Scoped to aarch64 because that is where it does anything; on x86 the flag is
# inert, and passing it there would only invite the question of why. One cost of
# saying it as `[target.'cfg(…)']`: cargo then ignores a `[build] rustflags` a
# contributor keeps in their own global config. `RUSTFLAGS` in the environment
# still overrides both.
#
# The limit worth knowing: cargo reads this file from the directory it is
# invoked in, so it covers the release workflow, `cargo build` and
# `cargo install --path .` from a clone — but not `cargo install git-xcrypt`
# from crates.io, which builds with cargo's own defaults and gets the software
# backend on aarch64. Named in `README.md` twice — at §Building, with the
# `RUSTFLAGS` line that gets it back, and in §Known limitations.
#
# A build script does not close that gap, so nobody needs to try it twice: a
# `cargo::rustc-cfg` emitted from `build.rs` applies to the crate that carries
# the script, and this flag has to land on the compilation of the `aes`
# dependency. There is no feature switch either — `aes` 0.8 gates the backend on
# the cfg alone. The thing to check when `aes-siv` reaches a stable 0.8 is
# whether a newer `aes` detects ARMv8 by itself; if it does, this file goes away
# with the bump.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8"]
