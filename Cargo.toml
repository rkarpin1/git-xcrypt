[package]
name = "git-xcrypt"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.rust]
# AGENTS.md makes "zero unsafe" a hard rule; this is what enforces it.
unsafe_code = "forbid"

[dependencies]
aes-siv = "0.7"
bstr = "1.13.0"
clap = { version = "4.6.5", features = ["derive"] }
getrandom = "0.4.3"
gix-config = "0.59.0"
gix-discover = { version = "0.54.0", features = ["sha1"] }
gix-glob = "0.27.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
