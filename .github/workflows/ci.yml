# The quality gate `context/foundation/zalozenia.md` §Jakość i testy describes.
#
# Three platforms is not thoroughness for its own sake. Whole branches of this
# codebase have never been executed on this project's development machine:
# `EolMode::Native`'s CRLF arm is `cfg!(windows)`, every key-permission test is
# `#[cfg(unix)]`, and APFS refuses the non-UTF-8 path names `decide` and the
# index are written to handle. Until this file existed, "identical behaviour on
# three platforms" was a claim with one measurement behind it.
#
# A note for anyone copying a `git-xcrypt status` gate out of here into their
# own project: this workflow tests the tool and does not gate on it — this
# repository is not itself encrypted. A gate looks like
#
#   - uses: actions/checkout@v5
#     with:
#       fetch-depth: 0            # NOT optional, see below
#   - run: git-xcrypt status
#
# and the exit code is the whole interface:
#
#   0  everything was checked, nothing found
#   5  a finding — a setup gap, a declared file staged in the clear, or a
#      plaintext version still in history. Rotate the secret before anything
#      else; rewriting history does not undo a leak.
#   6  the run could not answer: a shallow or partial clone, an unreadable
#      index, a reference store that will not enumerate, a missing
#      `.git-xcrypt`. Nothing was found and nothing is ruled out.
#   1-4 the tool itself failed.
#
# `fetch-depth: 0` is what separates 0 from 6. `actions/checkout` clones with
# `--depth 1` by default, and history that was never fetched cannot be scanned,
# so the default setup exits 6 rather than passing on a history it never saw.
# Until 2026-08-04 that case shared code 5 with a real leak, which made the
# default CI configuration fail the gate for no reason.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A filter that writes a backtrace to stdout would corrupt the file git is
  # storing. It goes to stderr, but the tests read both, so keep it quiet.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      # The integration tests drive a real git and compare raw objects, so the
      # git that runs them is part of the system under test. Printed rather than
      # pinned: a behaviour change in git is something this suite should catch,
      # not something it should be insulated from.
      - name: Report the git under test
        run: git --version

      # Every assertion about line endings is an assertion about what git does
      # with a working tree. A checkout that had already rewritten the fixtures
      # would be testing the runner, not the product.
      - name: Refuse to let the checkout rewrite line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `--no-fail-fast` is not tidiness. Without it cargo stops at the first
      # failing test target, so a platform the work is not done on reveals one
      # broken target per push — and each fix costs a whole CI round trip before
      # the next unknown appears. Twice now a Windows run has ended after a
      # single target with the rest never executed.
      - name: Test
        run: cargo test --all-targets --locked --no-fail-fast

      # `--all-targets` skips doctests; the crate has none today, and this is
      # what notices when it gains one.
      - name: Doctests
        run: cargo test --doc --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The whole suite, not just a build: the declared floor is a promise that
      # the product *works* there.
      - run: cargo test --all-targets --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Licences above all: the crate is published as `MIT OR Apache-2.0`, and a
      # copyleft dependency arriving through a transitive edge would invalidate
      # that choice silently. `advisories` and `sources` ride along.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories sources bans
